name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: site files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Required site files exist
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f demo.js
          test -f CNAME
          test -f LICENSE
          test -f SECURITY.md
          test -f demo/maul-recovered.json
          test -f demo/maul-unrecovered.json
          test -f demo/holds-pass.json
          test -f demo/holds-fail.json
          test -f demo/holds-compare.json
          test -f demo/vigil-ungoverned.json
          test -f demo/vigil-held.json
          test -f demo/provenance.json
          grep -qx 'getinvariant.sh' CNAME
